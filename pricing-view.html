<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에너가드컴퍼니 단가표 (보기 전용)</title>

<!-- ===============================================================
     pricing-view.html — 단가표 보기 전용 페이지
     2026-09-02: 통합관리시스템(index.html)의 단가표 탭을 그대로 재사용하되(js/pricing.js,
     js/pricing-competitor.js는 수정 없이 그대로 로드) 편집 UI만 전부 숨기고 원가/마진
     입력 필드를 readonly로 잠근, 상급자에게 보여주기용 독립 페이지. 로그인 없이 링크만으로
     접근하도록 anon key로 직접 Supabase를 읽는다 — 그러려면 아래 테이블에 anon SELECT
     권한이 있어야 한다(원래 이 프로젝트는 anon 읽기 자체가 막혀있어서 별도 허용 필요):
       GRANT SELECT ON pricing_costs TO anon;
       GRANT SELECT ON pricing_costs_history TO anon;
       GRANT SELECT ON competitor_prices TO anon;
       GRANT SELECT ON competitor_names TO anon;
       DROP POLICY IF EXISTS "anon read pricing_costs" ON pricing_costs;
       CREATE POLICY "anon read pricing_costs" ON pricing_costs FOR SELECT TO anon USING (true);
       DROP POLICY IF EXISTS "anon read pricing_costs_history" ON pricing_costs_history;
       CREATE POLICY "anon read pricing_costs_history" ON pricing_costs_history FOR SELECT TO anon USING (true);
       DROP POLICY IF EXISTS "anon read competitor_prices" ON competitor_prices;
       CREATE POLICY "anon read competitor_prices" ON competitor_prices FOR SELECT TO anon USING (true);
       DROP POLICY IF EXISTS "anon read competitor_names" ON competitor_names;
       CREATE POLICY "anon read competitor_names" ON competitor_names FOR SELECT TO anon USING (true);
     (쓰기 권한은 절대 주지 않음 — 이 페이지는 애초에 저장/편집 버튼 자체가 없음)
     =============================================================== -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pricing.css">
<link rel="stylesheet" href="css/toast.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  /* base.css의 body는 원래 사이드바+본문을 나란히 두려고 display:flex(가로)로 짜여있다.
     이 페이지는 사이드바가 없는 단독 페이지라 그 플렉스 컨텍스트가 오히려 방해가 된다
     — .view-topbar가 사이드바 자리처럼 옆으로 밀려 좁게 눌리는 버그가 있었다(2026-09-02,
     사용자 스크린샷으로 발견). 세로 문서 흐름으로 되돌린다. */
  /* 2026-09-02: NanumSquare(둥근 장식체)는 숫자 빼곡한 단가표엔 가독성이 떨어진다는
     지적 — Pretendard로 교체(index.html이 원래 쓰려던 폰트인데 정작 CDN 로드가 안 되어
     있어서 시스템 폰트로 대체되고 있었음, 이 페이지는 직접 로드). */
  body { display:block !important; background:#f4f5f9; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; }

  .view-topbar {
    display:flex; align-items:center; gap:10px;
    padding:12px 24px; background:#312e81; color:#fff;
    font-size:14px; font-weight:600;
  }
  .view-topbar i { color:#a5b4fc; }
  .view-topbar span.sub { font-weight:400; color:#c7d2fe; font-size:12px; margin-left:4px; }
  .view-loader {
    position:fixed; inset:0; background:#f4f5f9; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:#4f46e5; font-size:14px; font-weight:600;
  }
  .view-loader i { font-size:28px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 편집 관련 UI 전부 숨김 — 이 페이지는 애초에 저장 로직을 안 쓰지만, 눈에 보이는
     버튼/입력 상태까지 이중으로 막아서 "편집 가능한 것처럼 보이는" 혼란을 없앤다.
     이력 목록 조회(pricingHistoryWrap)는 화면표시 전환일 뿐이라 남겨두고, 그 안의
     "실제 적용" 버튼(phi-apply-btn, DB 쓰기)만 따로 숨김(2026-09-02). */
  .pricing-margin-edit-btn,
  .cp-th-actions,
  .phi-apply-btn,
  .pricing-live-badge.warn small { display:none !important; }
  input[readonly], select[readonly] {
    background:#f3f4f6 !important; color:#374151; cursor:default;
  }
  .content-body { max-width:1600px; margin:0 auto; padding:20px 24px 60px; }

  /* 숫자 가독성 — 자릿수 맞춰 세로로 훑어보기 쉽게 등폭 숫자 사용 */
  .pricing-result-card, .pricing-cost-card { font-variant-numeric: tabular-nums; }

  /* 표가 넓어서(경쟁사 컬럼까지 합치면 1500px 안팎) 화면 전체가 옆으로 밀리던 문제 —
     표 자체는 .pricing-table-scroll이 이미 overflow-x:auto로 자체 스크롤을 갖고 있으니
     (pricing.css), 그 바깥 컨테이너들은 전부 화면 폭에서 못 넘치게 막아서 스크롤이
     표 안쪽으로만 생기게 한다(2026-09-02). */
  html, body { overflow-x: hidden; max-width: 100vw; }
  .content-body, #page-pricing, .pricing-body-wrap, .pricing-tab-pane {
    max-width: 100%; overflow-x: hidden;
  }
  .pricing-table-scroll { overflow-x: auto !important; }
</style>
</head>
<body>

<div class="view-loader" id="viewLoader"><i class="fa-solid fa-circle-notch"></i>단가표 불러오는 중…</div>
<div id="toast-container" class="toast-container"></div>

<div class="view-topbar">
  <i class="fa-solid fa-eye"></i> 단가표 — 보기 전용
  <span class="sub">통합관리시스템과 실시간 연동 · 입력/편집 불가 · 엑셀 저장만 가능</span>
</div>

<div class="content-body">
  <div id="page-pricing" class="page-section active">

    <div class="card input-panel">
      <h3>
        <div class="nt-left">
          <span class="dash-lab-title" style="cursor:default;">
            <span class="dash-lab-icon pricing"><i class="fa-solid fa-tags"></i></span>
            <span><strong>단가표</strong></span>
          </span>
        </div>
        <div class="pricing-header-right" id="pricingHeaderRight">
          <span class="pricing-last-saved" id="pricingLastUpdated">원가 미입력</span>
          <span class="pricing-live-badge" id="pricingLiveBadge"></span>
          <div class="pricing-compare-toggle" id="pricingCompareToggle" role="group" aria-label="이전대비 비교 기준">
            <button type="button" class="pricing-compare-btn" data-mode="prev" onclick="setPricingCompareMode('prev')">이전달 대비</button>
            <button type="button" class="pricing-compare-btn active" data-mode="live" onclick="setPricingCompareMode('live')">실제 적용가 대비</button>
          </div>
          <!-- 이력 조회 — viewHistory()는 화면 표시만 바꾸는 순수 클라이언트 동작이라
               보기 전용 페이지에도 안전하게 넣을 수 있음. "실제 적용" 버튼만 CSS로 숨김
               (applyLivePrice는 DB 쓰기라 role 가드가 없지만, anon 키에 UPDATE 권한 자체를
               안 줬으니 이중으로 막혀있음, 2026-09-02). -->
          <div class="pricing-history-wrap" id="pricingHistoryWrap">
            <button class="pricing-history-btn" id="pricingHistoryBtn" onclick="toggleHistoryDropdown()">
              <i class="fa-solid fa-clock-rotate-left"></i> 이력
              <i class="fa-solid fa-chevron-down" style="font-size:10px; margin-left:2px;"></i>
            </button>
            <div class="pricing-history-dropdown" id="pricingHistoryDropdown">
              <div class="pricing-history-header">저장된 단가 이력</div>
              <div id="pricingHistoryList" class="pricing-history-list">
                <div class="pricing-history-empty">저장된 이력이 없습니다</div>
              </div>
            </div>
          </div>
          <button class="btn-server" onclick="exportPricingExcel()" style="background:#4338ca;">
            <i class="fa-solid fa-file-excel"></i> 엑셀 저장
          </button>
        </div>
      </h3>
    </div>

    <div class="pricing-tabs-bar" id="pricingTabsBar">
      <div class="pricing-tabs">
        <button class="pricing-tab active" onclick="setPricingTab('isopink',this)">아이소핑크</button>
        <button class="pricing-tab" onclick="setPricingTab('bead',this)">비드법단열재</button>
        <button class="pricing-tab" onclick="setPricingTab('pu',this)">경질우레탄보드</button>
        <button class="pricing-tab" onclick="setPricingTab('pf',this)">PF 보드</button>
        <button class="pricing-tab" onclick="setPricingTab('fr',this)">불연단열재</button>
      </div>
    </div>

    <div class="pricing-body-wrap" id="pricingBodyWrap">
      <!-- 각 탭 콘텐츠는 pricing.js의 initPricingTabs()가 동적으로 생성합니다 -->
      <div id="pricing-tab-isopink" class="pricing-tab-pane active"></div>
      <div id="pricing-tab-bead"    class="pricing-tab-pane"></div>
      <div id="pricing-tab-pu"      class="pricing-tab-pane"></div>
      <div id="pricing-tab-pf"      class="pricing-tab-pane"></div>
      <div id="pricing-tab-fr"      class="pricing-tab-pane"></div>
    </div>

  </div>
</div>

<!-- 모달 프레임 — pricing.js가 openPricingModal()에서 참조하지만, 이 페이지에선 관리자가
     아니라(currentUser=null) 항상 함수 초입에서 막히므로 실제로 열릴 일은 없다. 그래도
     querySelector 대상이 없으면 에러가 나는 다른 내부 참조를 피하려고 빈 틀만 남겨둔다. -->
<div class="modal-overlay" id="pricingInputModal" style="display:none;">
  <div class="pricing-input-modal-box">
    <div id="pimTitle"></div><div id="pimSub"></div><div id="pimBody"></div>
  </div>
</div>

<script>
  // ── 최소 부트스트랩 — common.js(로그인/사이드바 전체 시스템) 없이 pricing.js가 필요로
  // 하는 것만 직접 채워준다. pricing.js/pricing-competitor.js보다 반드시 먼저 실행되어야
  // 함(그 안의 함수들이 이 supabaseClient/showToast 등을 참조하므로, let 임시사각지대 걱정
  // 없이 안전하게 하려고 순서를 이렇게 둠). ────────────────────────────────────────────
  const SUPABASE_URL = "https://eukwfypbfqojbaihfqye.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MiBvlf3d6ulcVBsi7Odcgw_PTXSmXKj";
  let supabaseClient = null;
  if (typeof supabase !== 'undefined') {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  // 로그인 자체를 안 하는 페이지라 항상 비관리자 — pricing.js/pricing-competitor.js의
  // "role !== 'admin'" 가드가 모든 편집/저장 함수를 자동으로 막아준다.
  window.currentUser = null;

  function escapeAdminHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }
  function sanitizeAdminHtml(value) { return escapeAdminHtml(value); }
  function safeAdminUrl(value) {
    try {
      const u = new URL(String(value ?? ''), window.location.origin);
      return ['http:', 'https:', 'blob:'].includes(u.protocol) ? u.href : '';
    } catch { return ''; }
  }

  const TOAST_ICONS = {
    success: '<i class="fa-solid fa-circle-check"></i>',
    error:   '<i class="fa-solid fa-circle-xmark"></i>',
    warning: '<i class="fa-solid fa-triangle-exclamation"></i>',
    info:    '<i class="fa-solid fa-circle-info"></i>',
  };
  function showToast(message, type = 'info', duration = 3500) {
    const container = document.getElementById('toast-container');
    if (!container) { console.warn('[Toast]', message); return; }
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    const icon = document.createElement('span');
    icon.className = 'toast-icon';
    icon.innerHTML = TOAST_ICONS[type] || TOAST_ICONS.info;
    const messageEl = document.createElement('span');
    messageEl.className = 'toast-msg';
    messageEl.textContent = String(message ?? '');
    toast.append(icon, messageEl);
    container.appendChild(toast);
    const remove = () => {
      toast.classList.add('hiding');
      toast.addEventListener('transitionend', () => toast.remove(), { once: true });
    };
    const timer = setTimeout(remove, duration);
    toast.addEventListener('click', () => { clearTimeout(timer); remove(); });
  }
</script>

<script src="js/pricing.js"></script>
<script src="js/pricing-competitor.js"></script>
<script>
  // pricing.js가 자기 DOMContentLoaded 리스너(initPricingTabs)를 이미 등록해둔 뒤에
  // 이 스크립트가 실행되므로, 여기서 등록하는 리스너는 항상 그 다음에 실행된다
  // → 표 골격(입력 필드 포함)이 다 만들어진 뒤에 실제 데이터를 채워 넣는 순서가 보장됨.
  document.addEventListener('DOMContentLoaded', () => {
    loadPricingCosts().finally(() => {
      const loader = document.getElementById('viewLoader');
      if (loader) loader.style.display = 'none';

      // 원가 입력 필드를 readonly로 잠근다 — 값은 그대로 보이되 타이핑/저장은 불가.
      // select/checkbox/radio는 readonly가 안 먹혀서 disabled로 처리(2026-09-02).
      // (마진 입력은 애초에 화면에 보이는 <input>이 아니라 숨김 필드라 여기 포함해도 무해)
      document.querySelectorAll('input, select, textarea').forEach((el) => {
        const type = (el.type || '').toLowerCase();
        if (el.tagName === 'SELECT' || type === 'checkbox' || type === 'radio') {
          el.disabled = true;
        } else {
          el.readOnly = true;
        }
        el.tabIndex = -1;
      });
    });
  });
</script>
</body>
</html>
