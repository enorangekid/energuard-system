<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
  <title>NBA 알림</title>
  <link rel="stylesheet" href="notification.css">
</head>
<body>
  <article id="card" class="toast-card" role="button" tabindex="0" aria-label="경기 문자중계 열기">
    <div class="accent"></div>
    <header><span id="appMark" class="app-mark">NBA</span><b>LIVE UPDATE</b><span id="meta"></span><button id="pin" class="pin-button" aria-label="알림 고정" aria-pressed="false" title="알림 고정">◇</button><button id="dismiss" aria-label="알림 닫기">×</button></header>
    <section class="scoreline">
      <div class="club away"><img id="awayLogo" alt=""><span id="awayName"></span></div>
      <div class="score"><strong id="awayScore">-</strong><i>:</i><strong id="homeScore">-</strong></div>
      <div class="club home"><span id="homeName"></span><img id="homeLogo" alt=""></div>
    </section>
    <div class="eventline"><img id="playerImage" alt=""><div><b id="playerName"></b><p id="playText"></p></div></div>
    <small class="hint">클릭해서 전체 문자중계 보기</small>
  </article>
  <script src="notification.js"></script>
</body>
</html>
